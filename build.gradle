buildscript {
    repositories { maven { url = 'https://maven.minecraftforge.net/' }; mavenCentral(); gradlePluginPortal() }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT' }
}
apply plugin: 'net.minecraftforge.gradle.forge'
version = '0.1-beta-r79'
// Compile against the native forge input. The dependency ships separately.
repositories { maven { url = 'https://www.cursemaven.com' } }
dependencies { compileOnly 'curse.maven:iceandfire-rlcraft-888556:8061963' }
group = 'cn.longyuangang'
archivesBaseName = 'ThousandribbonsTravel'
sourceCompatibility = targetCompatibility = '1.8'
minecraft { version = '1.12.2-14.23.5.2847'; runDir = 'run'; mappings = 'stable_39' }
tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
// 无额外测试库：真实构建时运行仪式与数值回归测试。
task triuneRulesTest(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath
    main = 'cn.longyuangang.TriuneRulesTest'
}
check.dependsOn triuneRulesTest
// ForgeGradle 2.3 的 userdev 工作区自带一个 api 源集；本工程没有 api 源码，
// compileApiJava 每次 NO-SOURCE 被整体跳过（连 doLast 都不跑），Gradle 的
// 过期输出清理把空的 build/classes/java/api 目录删掉，而它在 main 的编译
// 类路径上（平台类型检查要求类路径条目必须存在）。在导出类路径的任务
// 执行前把这个空目录补回来。
tasks.matching { it.name == 'hxExportCompileClasspath' }.all { t ->
    t.doFirst {
        project.file('build/classes/java/api').mkdirs()
        project.file('build/resources/api').mkdirs()
    }
}
processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version
    from(sourceSets.main.resources.srcDirs) { include 'mcmod.info'; expand 'version': project.version, 'mcversion': project.minecraft.version }
    from(sourceSets.main.resources.srcDirs) { exclude 'mcmod.info' }
    exclude 'assets/longyuangang/modelsource/ModelLongYuanArmor.java.txt',
            'assets/longyuangang/modelsource/guigui.bbmodel',
            'assets/longyuangang/modelsource/guigui.png',
            'assets/longyuangang/modelsource/guigui_preview.png',
            'assets/longyuangang/modelsource/longyuangang_armor.bbmodel',
            'assets/longyuangang/modelsource/longyuangang_armor.png',
            'assets/longyuangang/modelsource/origin_dragonforge.bbmodel',
            'assets/longyuangang/modelsource/origin_dragonforge_preview.png'
}
